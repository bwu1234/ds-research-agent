# Copy to config/local.yaml (ignored by Git) and replace the absolute paths.
model:
  host: http://127.0.0.1:11434
  name: qwen3.8:27b-mlx
  think: medium            # false | low | medium | xhigh; chosen in D1
  options:
    temperature: 0
    seed: 0
  keep_alive: 30m
  request_timeout_s: 900
  server_version: 0.35.1      # D0/D1 measured here; 0.40.x MLX panics on cache reuse

mcp:
  command: /ABS/PATH/rag-toolkit-dsra/.venv/bin/python
  args: ["-m", "rag.mcp", "--config", "/ABS/PATH/ds-research-agent/data/fixture/rag.yaml"]
  cwd: /ABS/PATH/rag-toolkit-dsra
  protocol_version: "2026-07-28"
  required_tools: [rag_search, rag_list_corpora]
  call_timeout_s: 120
  max_result_chars: 60000

catalogue:
  data_root: /ABS/PATH/ds-research-agent/tests/fixtures/lake
  cards_dir: /ABS/PATH/ds-research-agent/data/fixture/cards
  manifest_path: /ABS/PATH/ds-research-agent/data/fixture/manifest.json
  corpus: fixture-cards
  sample_rows: 10000
  card_sample_rows: 3
  max_example_values: 3
  max_cell_chars: 80
  max_json_bytes: 50000000

rag_service:
  checkout: /ABS/PATH/rag-toolkit-dsra
  revision: b7434cf8b98f5843f3810b2c763f1732b72d770d
  python: /ABS/PATH/rag-toolkit-dsra/.venv/bin/python
  base_config: /ABS/PATH/rag-toolkit-dsra/rag/config/config.yaml
  generated_config: /ABS/PATH/ds-research-agent/data/fixture/rag.yaml
  index_dir: /ABS/PATH/ds-research-agent/data/fixture/index
  index_timeout_s: 1800

agent:
  tool_call_max_repairs: 2
  max_steps: 20               # D3 sets these from the 12-task sample
  max_wall_s: 1800              # registered D3 per-task limit (30 min)
  max_output_tokens: 8192
  max_tool_output_chars: 4000
  replan_after_repeats: 2
  no_progress_after_repeats: 2   # 3 near-identical successful cells in a row
  no_progress_similarity: 0.95
  budget_warning_steps: 2
  submit_checks: 2
  server_retries: 2

sandbox:
  docker: docker
  image: dsra-sandbox:d3
  work_root: /ABS/PATH/ds-research-agent/data/sandbox
  wall_timeout_s: 300
  host_grace_s: 30
  cpu_time_s: 600
  max_file_bytes: 1073741824 # per file the program writes, stdout included
  memory_mb: 8192
  cpus: 4
  pids_limit: 256
  tmp_mb: 256
  max_output_chars: 20000
  cell_timeout_s: 300
  session_timeout_s: 3600
  interrupt_grace_s: 10

kramabench:
  repo_url: https://github.com/mitdbg/KramaBench.git
  commit: b2e0d77540263f8b6119f977fe79a8c4386b5a02
  checkout: /ABS/PATH/ds-research-agent/data/kramabench/repo
  visible_root: /ABS/PATH/ds-research-agent/data/kramabench/visible
  evaluator_root: /ABS/PATH/ds-research-agent/data/kramabench/evaluator

eval:
  ledger_path: /ABS/PATH/ds-research-agent/data/runs/ledger.sqlite3
  split_seed: 20261007
  dev_fraction: 0.5
  split_sha256: 70fe80e1abefd246065a40bc22a6c61bd0badc45f02e6c8e91c7fd5a8fb77f93  # frozen 2026-10-07; runs refuse any other split
  sample_per_domain: 2
  answer_type_visible: false # decided in D1; see docs/implementation-plan.md
  task_timeout_s: 900          # <= model.request_timeout_s
  max_output_tokens: 8192
  inline_max_chars: 30000
  bootstrap_resamples: 10000
  bootstrap_seed: 0
