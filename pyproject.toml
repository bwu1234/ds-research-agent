[project]
name = "ds-research-agent"
version = "0.0.1"
description = "Data research agent: discover files, analyse in a sandbox, answer with provenance."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "ollama==0.6.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-pyyaml",
    "pytest-asyncio>=1.4.0",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ds_research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls the local model or a live MCP server; excluded by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["ds_research_agent", "eval"]

[tool.pyright]
venvPath = "."
venv = ".venv"
